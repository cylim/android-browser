version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns: ["*"]
    # The Compose BOM is held at 2026.09.00. See the note in android/gradle/libs.versions.toml.
    ignore:
      - dependency-name: androidx.compose:compose-bom
        versions: ["2026.11.01"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
