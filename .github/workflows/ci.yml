name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Which parts of the monorepo a pull request touches, so a website-only change skips the
  # Android jobs and the other way round. Pushes to main run everything. A job skipped by its
  # `if` still counts as passing for branch protection, so the jobs below fail closed: they
  # skip only on an explicit "false", and run if this job fails and leaves its outputs empty.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
      website: ${{ steps.diff.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo android=true >> "$GITHUB_OUTPUT"
            echo website=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both paths of a move, so moving a file out of android/ still counts.
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          printf '%s\n' "$files"
          touched() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          echo "android=$(touched '^(android/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "website=$(touched '^(website/|\.github/workflows/(ci|pages)\.yml$)')" >> "$GITHUB_OUTPUT"

  android:
    name: Android build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build, lint and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest

  # The device tests (android/app/src/androidTest) on a phone and a tablet emulator, Android 17.
  device-tests:
    name: Device tests (${{ matrix.device.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: phone, profile: pixel_7, ram: 4096M }
          - { name: tablet, profile: pixel_tablet, ram: 3072M }
    env:
      # Command-line Tools 22 or later. Older avdmanager writes target=android-0 into the AVD,
      # and Android 17 images then crash in a loop (issuetracker.google.com/issues/557246813).
      CMDLINE_TOOLS_ZIP: commandlinetools-linux-16111833_latest.zip # 23.0
      CMDLINE_TOOLS_SHA256: 0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Command-line Tools 23.0 (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/$CMDLINE_TOOLS_ZIP" "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP"
          echo "$CMDLINE_TOOLS_SHA256  $RUNNER_TEMP/$CMDLINE_TOOLS_ZIP" | sha256sum --check --strict
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/$CMDLINE_TOOLS_ZIP" -d "$RUNNER_TEMP/clt"
          mv "$RUNNER_TEMP/clt/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          grep Pkg.Revision "$ANDROID_HOME/cmdline-tools/latest/source.properties"

      - name: Build the app and its tests
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run the device tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          ram-size: ${{ matrix.device.ram }}
          disable-animations: true
          working-directory: android
          # No "isn't responding" dialogs from the emulator's own apps: one of those takes the
          # focus from the app's window, and every test that presses Back then times out.
          # On failure, print each failing test so the log says what broke.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew connectedDebugAndroidTest || { grep -rh -A8 '<failure' app/build/outputs/androidTest-results; exit 1; }

      - name: Upload the device test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports-${{ matrix.device.name }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  # The product website (website/public). pages.yml publishes it from main; this checks a PR.
  website:
    name: Website
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.website != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No outside addresses besides this repository on GitHub, and no broken links or assets.
      # Building with the Pages project path also checks that the 404 page's paths fill in.
      - name: Check the site
        run: python3 -I website/build.py --base-path /android-browser --out "$RUNNER_TEMP/site"
