<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages can't send headers, so the policy is here: only the site's own files load.
       Inline style attributes set the Profile colors (style="--c:…"), hence style-src-attr. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Page not found · Okapi, a browser by JRNY</title>
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this page for a missing address at any depth, so relative paths
       would break. The Pages workflow replaces __BASE_PATH__ with the site's path, such as
       "/android-browser", or with nothing on a custom domain. -->
  <link rel="icon" href="__BASE_PATH__/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="__BASE_PATH__/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="__BASE_PATH__/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="__BASE_PATH__/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="__BASE_PATH__/styles.css">
</head>
<body>
  <header class="site-head wrap">
    <a class="brand" href="__BASE_PATH__/" aria-label="Okapi by JRNY, home">
      <picture>
        <source srcset="__BASE_PATH__/assets/mark-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="__BASE_PATH__/assets/mark.svg" alt="" width="56" height="64">
      </picture>
      <span>Okapi by JRNY</span>
    </a>
  </header>

  <main id="main">
    <section class="hero wrap" aria-labelledby="nf-title">
      <div class="hero-text">
        <p class="eyebrow">404</p>
        <h1 id="nf-title">There's no page here.</h1>
        <p class="lede">The address may have a typo, or the page has moved.</p>
        <div class="actions"><a class="btn btn-primary" href="__BASE_PATH__/">Go to the Okapi home page</a></div>
      </div>
    </section>
  </main>
</body>
</html>
